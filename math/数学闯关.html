<script id="quest-core">
'use strict';
const MathQuest=(()=>{
 const norm=s=>String(s??'').normalize('NFKC').trim().replace(/[，、；;]/g,',').replace(/\s+/g,'').replace(/[。．]$/,'');
 function answerMatches(q,value){
  const expected=Array.isArray(q.answer)?q.answer:[q.answer],got=Array.isArray(value)?value:expected.length>1?String(value).split(/[,，、;；\n]/):[String(value)];
  if(got.length!==expected.length)return false;
  return expected.every((a,i)=>{let g=norm(got[i]);const u=Array.isArray(q.unit)?q.unit[i]:q.unit;if(u)g=g.replace(new RegExp('(?:'+u.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')$'),'');
   if(typeof a==='number')return /^-?\d+(?:\.\d+)?$/.test(g)&&Number(g)===a;
   const aliases={'对':['对','正确','是','√'],'错':['错','错误','否','×'],'够':['够','足够'],'不够':['不够','不足']};
   return (aliases[a]||[norm(a),...(q.aliases||[]).map(norm)]).includes(g);
  });
 }
 const zh=['零','一','二','三','四','五','六','七','八','九'];
 function section(n){let s='',zero=false;for(let p=3;p>=0;p--){const d=Math.floor(n/10**p)%10;if(d){if(zero)s+='零';s+=zh[d]+['','十','百','千'][p];zero=false;}else if(s)zero=true;}return s;}
 function readNumber(n){if(!Number.isSafeInteger(n)||n<0||n>=1e12)throw Error('请输入十二位以内的非负整数');if(!n)return'零';let s='',gap=false;for(let p=2;p>=0;p--){const d=Math.floor(n/10000**p)%10000;if(d){if(s&&(gap||d<1000))s+='零';s+=section(d)+['','万','亿'][p];gap=false;}else if(s)gap=true;}return s.replace(/^一十/,'十');}
 function calc(source){const str=norm(source).replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/[＋]/g,'+').replace(/[－−]/g,'-').replace(/[\[【]/g,'(').replace(/[\]】]/g,')');
  if(str.length>160||!/^[\d.+*/()\-]+$/.test(str))throw Error('只输入数字、四则运算符和括号');
  const tokens=str.match(/\d+(?:\.\d+)?|[+*/()\-]/g)||[];if(tokens.join('')!==str||tokens.length>80)throw Error('算式格式不完整');let i=0;
  function factor(){const t=tokens[i++];if(t==='('){const x=expr();if(tokens[i++]!==')')throw Error('括号不配对');return x;}if(t==='-')return-factor();if(t==='+' )return factor();if(!/^\d+(?:\.\d+)?$/.test(t||''))throw Error('这里需要一个数');return Number(t);}
  function term(){let x=factor();while(['*','/'].includes(tokens[i])){const op=tokens[i++],y=factor();if(op==='/'&&y===0)throw Error('0不能作除数');x=op==='*'?x*y:x/y;}return x;}
  function expr(){let x=term();while(['+','-'].includes(tokens[i])){const op=tokens[i++],y=term();x=op==='+'?x+y:x-y;}return x;}
  const result=expr();if(i!==tokens.length||!Number.isFinite(result)||Math.abs(result)>Number.MAX_SAFE_INTEGER)throw Error('算式格式或数值超出范围');return result;
 }
 function session(ids,unit,round){return{ids:[...ids],unit,round,index:0,attempts:{},done:false};}
 function attempt(s,id,ok){if(!s.attempts[id])s.attempts[id]={first:!!ok,tries:0,revealed:false,correct:false};const a=s.attempts[id];if(a.correct)return a;a.tries++;a.correct=!!ok;return a;}
 function reveal(s,id){if(!s.attempts[id])s.attempts[id]={first:false,tries:0,correct:false,revealed:true};s.attempts[id].revealed=true;s.attempts[id].first=false;return s.attempts[id];}
 const score=s=>s.ids.filter(id=>s.attempts[id]?.first&&!s.attempts[id]?.revealed).length;
 function stars(a,b,c){return a>=6&&b>=6?(a===7&&b===7?(c>=3?3:2):1):0;}
 const fresh=()=>({version:1,stars:{},results:{},needs:[],cleared:[],current:null,sessions:{},muted:true,topics:[],pedagogy_v2:null});
 function restore(raw,validIds,validUnits){try{
  const x=JSON.parse(raw);if(x?.version!==1)return fresh();const y=fresh();
  function readSession(s,u){
   if(!s||s.unit!==u||!['a','b','c','final','review','node'].includes(s.round)||!Array.isArray(s.ids)||s.ids.length<1||s.ids.length>18||new Set(s.ids).size!==s.ids.length||!s.ids.every(id=>validIds.includes(id)&&id.startsWith(u+'-'))||!Number.isInteger(s.index)||s.index<0||s.index>=s.ids.length)return null;
   const z=session(s.ids,u,s.round);z.index=s.index;z.reviewTarget=validIds.includes(s.reviewTarget)?s.reviewTarget:null;z.done=s.done===true;
   for(const id of z.ids){const a=s.attempts?.[id];if(a&&Number.isInteger(a.tries)&&a.tries>=0)z.attempts[id]={first:a.first===true,tries:a.tries,revealed:a.revealed===true,correct:a.correct===true};}return z;
  }
  for(const u of validUnits){
   if(Number.isInteger(x.stars?.[u])&&x.stars[u]>=0&&x.stars[u]<=3)y.stars[u]=x.stars[u];const r=x.results?.[u];
   if(r&&typeof r==='object'){y.results[u]={};for(const [key,max] of [['a',7],['b',7],['c',4],['final',12]])if(Number.isInteger(r[key])&&r[key]>=0&&r[key]<=max)y.results[u][key]=r[key];}
   const s=readSession(x.sessions?.[u],u);if(s&&!s.done)y.sessions[u]=s;
  }
  for(const k of ['needs','cleared'])y[k]=[...new Set(Array.isArray(x[k])?x[k].filter(id=>validIds.includes(id)):[])];y.topics=Array.isArray(x.topics)?x.topics.filter(t=>['tiles','travel','measure','billion'].includes(t)):[];y.muted=x.muted!==false;if(x.pedagogy_v2&&typeof x.pedagogy_v2==='object')y.pedagogy_v2=x.pedagogy_v2;
  const c=x.current;if(c&&validUnits.includes(c.unit)&&['mind','learn','quiz','result'].includes(c.tab)){y.current={unit:c.unit,tab:c.tab,node:typeof c.node==='string'?c.node:null};const s=readSession(c.session,c.unit);if(s){y.current.session=s;if(!s.done)y.sessions[c.unit]=s;}else if(c.tab==='quiz')y.current.tab='mind';}return y;
 }catch{return fresh();}}
 function perimeter(cells){const set=new Set(cells.map(([x,y])=>`${x},${y}`));return cells.reduce((sum,[x,y])=>sum+[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>!set.has(`${a},${b}`)).length,0);}
 return{norm,answerMatches,readNumber,calc,session,attempt,reveal,score,stars,fresh,restore,perimeter};
})();
globalThis.MathQuest=MathQuest;
</script>

function labShell(title,prompt,controls,draw,expected,observation,conclusion){const guide=LAB_GUIDES[labState.kind]||['调整一个条件，比较操作前后的图形。','找出没变的量和变化的量。'];const host=$('#labHost');host.innerHTML=`<h3>${title}</h3><p>${prompt}</p><div class="connection"><strong>怎样探索</strong><ol style="margin:8px 0;padding-left:24px"><li>先想一想，把当前条件下的预测写在下面。</li><li>${guide[0]}</li><li>点击“验证预测”，对照自己的想法。</li><li>${guide[1]}</li></ol></div><div id="labGuideStatus" class="notice" role="status" aria-live="polite">当前任务：先预测；也可先调整条件，再为新条件预测。</div><div class="prediction"><label for="predictionInput" id="predictionLabel">先预测：${prompt}</label><input id="predictionInput" class="field" autocomplete="off" placeholder="写下预测，再动手验证"><p class="small muted" style="margin:6px 0 0">预测允许出错；改条件后可以重新预测。</p></div>${controls}<div class="lab-stage" id="labCanvas"></div><button class="btn primary" id="observeBtn">验证预测，查看解释</button><div id="observation" role="status" aria-live="polite"></div>`;
 const syncPrediction=()=>{const q=expected(),old=$('#predictionInput');let choices=null;
 if(typeof q.answer==='string'){
  const kind=labState.kind;
  if(kind==='trial')choices=['偏大','偏小','合适'];
  else if(kind==='estimate')choices=['够','不够','不能确定'];
  else if(kind==='travel')choices=['可以','不可以'];
  else if(kind==='compare')choices=['大于','小于','等于'];
  else if(kind==='read'){const n=Number([...host.querySelectorAll('.place-cell b')].map(x=>x.textContent).join(''));choices=[q.answer,M.readNumber(n<=999999989999?n+10000:n-10000),M.readNumber(Math.floor(n/10)),q.answer.replace(/零/g,'')];}
  else if(kind==='code'){const y=$('#codeYear').value,c=$('#codeClass').value,n=$('#codeNo').value;choices=[q.answer,y+c+n,y+n.padStart(2,'0')+c.padStart(2,'0'),y+c.padEnd(2,'0')+n.padEnd(2,'0'),y+c.padStart(2,'0')+String(+n+1).padStart(2,'0')];}
  else if(kind==='groups')choices=['不能整除','可以整除'];
 }
 choices=choices?[...new Set(choices.filter(Boolean))]:null;
 const signature=choices?JSON.stringify(choices):'number';if(old.dataset.signature===signature)return;
 const value=old.value,el=document.createElement(choices?'select':'input');el.id='predictionInput';el.className='field';el.dataset.signature=signature;
 if(choices){const offset=q.answer.length%choices.length;choices=choices.slice(offset).concat(choices.slice(0,offset));el.innerHTML='<option value="">请选择预测</option>'+choices.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');}
 else{el.autocomplete='off';el.placeholder='写下预测，再动手验证';el.inputMode=Array.isArray(q.answer)?'text':'decimal';}
 old.replaceWith(el);if(choices?.includes(value)||(!choices&&old.tagName==='INPUT'))el.value=value;
 el.addEventListener('input',()=>{$('#labGuideStatus').textContent='预测已填写：按上方指引操作或检查图形，再点击“验证预测”。';});el.addEventListener('keydown',e=>{if(e.key==='Enter')$('#observeBtn').click();});
 };
 const redraw=()=>{host.querySelectorAll('input[type=range]').forEach(x=>{const o=$('#'+x.id+'O');if(o)o.textContent=x.value;});$('#labGuideStatus').textContent='当前任务：观察图形和条件，填写或更新预测，再点击验证。';draw();syncPrediction();$('#observation').innerHTML='';};
 host.querySelectorAll('input[type=range],select,input.lab-input').forEach(x=>x.addEventListener('input',redraw));$('#observeBtn').onclick=()=>{const value=$('#predictionInput').value;if(!value.trim()){$('#observation').innerHTML='<div class="notice">先写一个预测。猜错也没关系，我们用操作验证。</div>';return;}const q=expected(),ok=M.answerMatches(q,value);$('#labGuideStatus').textContent='下一步：'+guide[1]+' 再只改一个条件，预测后重新验证。';$('#observation').innerHTML=`<div class="result-line ${ok?'good':'muted'}">${ok?'✓ 预测吻合':'把预测与观察比较一下'}：${observation()}</div><div class="insight"><strong>为什么？</strong><br>${typeof conclusion==='function'?conclusion():conclusion}</div>`;};redraw();return redraw;

 else if(a==='check')check();else if(a==='reveal')reveal();else if(a==='next')next();else if(a==='skip')next(true);
 else if(a==='retry'){const old=quiz;start(old.round,old.ids,old.reviewTarget);}
 else if(a==='summary'){quiz=null;renderSummary();}
 else if(a==='practice')practice(b.dataset.q);
 else if(a==='qlab'){const q=questions[b.dataset.q];if(q.owner==='final')unit(q.node,'learn');else unit(q.owner,'learn',q.node);}
});
$('#homeBtn').onclick=home;$('#reviewBtn').onclick=review;$('#sourceBtn').onclick=sources;
function soundLabel(){$('#soundBtn').textContent='音效：'+(state.muted?'关':'开');$('#soundBtn').setAttribute('aria-pressed',!state.muted);}
$('#soundBtn').onclick=()=>{state.muted=!state.muted;save();soundLabel();if(!state.muted)sound('good');};
$('#resetBtn').onclick=()=>{if(confirm('要清除当前浏览器中的星星、闯关进度和待巩固记录吗？这不会修改教材。')){state=M.fresh();soundLabel();home();}};
soundLabel();storageMessage();
const resume=state.current;
if(resume){activeUnit=unitById[resume.unit];activeTab=resume.tab;activeNode=resume.node||activeUnit.nodes[0].id;quiz=resume.session||null;view='unit';accent(activeUnit.color);renderUnit();}else home();
window.addEventListener('pagehide',save);
globalThis.QuestApp={get state(){return state;},get quiz(){return quiz;},get activeUnit(){return activeUnit;},get activeNode(){return activeNode;},get view(){return view;}};
</script>

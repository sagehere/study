function buildLesson(i){const grid=$('#lessonGrid'),mistake=$('#mistake');if(i===0){grid.innerHTML=`<section class="lab"><h3>试商实验室</h3><p>用＋/－调整商，让余数小于除数。</p><div class="formula">228 ÷ 38</div><div class="stepper"><button data-delta="-1">−</button><output id="trial">5</output><button data-delta="1">＋</button></div><div class="lab-result" id="trialResult"></div><div class="rule">四舍初商易偏大，五入初商易偏小；最后一定检查余数。</div></section><section class="lab"><h3>换一题练调商</h3><p>196÷28，把28看作30，试商后再检查。</p><div class="formula">196 ÷ 28</div><div class="stepper"><button data-delta2="-1">−</button><output id="trial2">6</output><button data-delta2="1">＋</button></div><div class="lab-result" id="trialResult2"></div></section>`;let a=5,b=6;const run=(n,d,r)=>{const p=n*d,rem=228===n?0:0;let text,cls;if(p>228){text=`${n}×38＝${p}＞228，商偏大，减1再试。`;cls='bad'}else if(228-p>=38){text=`余数${228-p}≥38，商偏小，加1再试。`;cls='bad'}else{text=`成功！${n}×38＝${p}，余数${228-p}＜38。`;cls='good'}$(r).textContent=text;$(r).className='lab-result '+cls};const run2=()=>{let p=b*28,rem=196-p;$('#trial2').textContent=b;$('#trialResult2').textContent=p>196?`${b}×28＝${p}，太大，商要调小。`:rem>=28?`余数${rem}太大，商要调大。`:`成功！商${b}，余数${rem}。`;$('#trialResult2').className='lab-result '+(p<=196&&rem<28?'good':'bad')};document.querySelectorAll('[data-delta]').forEach(x=>x.onclick=()=>{a=Math.max(1,Math.min(9,a+(+x.dataset.delta)));$('#trial').textContent=a;run(a,38,'#trialResult')});document.querySelectorAll('[data-delta2]').forEach(x=>x.onclick=()=>{b=Math.max(1,Math.min(9,b+(+x.dataset.delta2)));run2()});run(a,38,'#trialResult');run2();mistake.innerHTML=`<strong>易错挑战：</strong>84÷5＝16……4，那么840÷50的余数？ <button class="chip" data-rem="4">4</button> <button class="chip" data-rem="40">40</button><div id="remFb"></div>`;document.querySelectorAll('[data-rem]').forEach(x=>x.onclick=()=>$('#remFb').innerHTML=x.dataset.rem==='40'?'✅ 对！商不变，余数要还原。16×50＋40＝840。':'再想想：去掉的0要给余数添回来，验算16×50＋4≠840。')}
else if(i===1){grid.innerHTML=`<section class="lab"><h3>图形拉伸器</h3><p>拖动长和宽，观察周长与面积怎样变化。</p><div class="slider-row"><b>长</b><input id="len" type="range" min="1" max="10" value="8"><output id="lenO">8</output></div><div class="slider-row"><b>宽</b><input id="wid" type="range" min="1" max="10" value="2"><output id="widO">2</output></div><div class="shape-stage"><div class="rect" id="rect"></div></div><div class="lab-result" id="shapeFb"></div><div class="rule">周长相等时，长和宽越接近，面积越大。</div></section><section class="lab"><h3>靠墙篱笆规划师</h3><p>17×8米菜园，选哪条边靠墙最省篱笆？</p><div class="control-row"><button class="chip" data-wall="17">长边靠墙</button><button class="chip" data-wall="8">宽边靠墙</button></div><div class="lab-result" id="wallFb">先选一条边。</div></section>`;const draw=()=>{let a=+$('#len').value,b=+$('#wid').value;$('#lenO').textContent=a;$('#widO').textContent=b;$('#rect').style.width=(55+a*12)+'px';$('#rect').style.height=(35+b*8)+'px';$('#rect').textContent=`${a}×${b}`;$('#shapeFb').textContent=`周长 ${(a+b)*2} 米｜面积 ${a*b} 平方米`};$('#len').oninput=draw;$('#wid').oninput=draw;draw();document.querySelectorAll('[data-wall]').forEach(x=>x.onclick=()=>{$('#wallFb').textContent=x.dataset.wall==='17'?'长边靠墙：17＋8×2＝33米，最省！':'宽边靠墙：8＋17×2＝42米。';$('#wallFb').className='lab-result '+(x.dataset.wall==='17'?'good':'bad')});mistake.innerHTML='<strong>易错提醒：</strong>靠墙的一边不用围，先在图上划掉它，只计算另外三边。'}
else if(i===2){grid.innerHTML=`<section class="lab"><h3>数量关系三角</h3><p>点击一个量“遮住”它，看求它要用什么公式。</p><div class="control-row"><button class="chip active" id="priceMode">总价组</button><button class="chip" id="roadMode">路程组</button></div><div class="formula-tri" id="tri"></div><div class="lab-result" id="triFb">点击一个量。</div></section><section class="lab"><h3>小车行程模拟</h3><p>调速度，观察3小时后的路程。</p><div class="slider-row"><b>速度</b><input id="speed" type="range" min="10" max="100" step="10" value="60"><output id="speedO">60</output></div><div class="car-track"><span class="car" id="car">🚙</span></div><button class="mini-btn" id="goCar">出发3小时</button><div class="lab-result" id="carFb"></div></section>`;let mode='price';const tri=()=>{const ns=mode==='price'?['总价','单价','数量']:['路程','速度','时间'];$('#tri').innerHTML=ns.map(n=>`<button data-node="${n}">${n}</button>`).join('');document.querySelectorAll('[data-node]').forEach(x=>x.onclick=()=>{const f={总价:'单价×数量＝总价',单价:'总价÷数量＝单价',数量:'总价÷单价＝数量',路程:'速度×时间＝路程',速度:'路程÷时间＝速度',时间:'路程÷速度＝时间'};$('#triFb').textContent=f[x.dataset.node];x.classList.add('hidden-node')})};$('#priceMode').onclick=()=>{mode='price';tri()};$('#roadMode').onclick=()=>{mode='road';tri()};tri();$('#speed').oninput=()=>$('#speedO').textContent=$('#speed').value;$('#goCar').onclick=()=>{let s=+$('#speed').value;$('#car').style.left='calc(100% - 40px)';$('#carFb').textContent=`${s}×3＝${s*3}千米`;setTimeout(()=>$('#car').style.left='0',1700)};mistake.innerHTML='<strong>易错提醒：</strong>“每小时比……快多少”要先分别求出两种速度，再相减，不能直接拿路程相减。'}
else if(i===3){grid.innerHTML=`<section class="lab"><h3>运算顺序点一点</h3><p>按先后顺序点击运算符。</p><div class="order-expression"><span>32</span><button class="op-token" data-order="2">＋</button><span>18</span><button class="op-token" data-order="1">×</button><span>4</span></div><div class="lab-result" id="orderFb">第一步该点哪个运算符？</div><div class="rule">先乘除，后加减；同级从左往右。</div></section><section class="lab"><h3>括号魔法师</h3><p>哪种加括号的方法结果最大？</p><div class="control-row"><button class="chip" data-br="34">(6＋3)×4－2</button><button class="chip" data-br="12">6＋3×(4－2)</button><button class="chip" data-br="18">(6＋3)×(4－2)</button></div><div class="lab-result" id="brFb">点一个算式看结果。</div></section>`;let order=1;document.querySelectorAll('[data-order]').forEach(x=>x.onclick=()=>{if(+x.dataset.order===order){x.classList.add('done');$('#orderFb').textContent=order++===1?'对！先算18×4＝72，再算加法。':'完成：32＋72＝104。'}else{$('#orderFb').textContent='顺序不对：先乘除，后加减。';$('#orderFb').className='lab-result bad'}});document.querySelectorAll('[data-br]').forEach(x=>x.onclick=()=>{$('#brFb').textContent=`结果是${x.dataset.br}${x.dataset.br==='34'?'，这是最大值！':''}`;$('#brFb').className='lab-result '+(x.dataset.br==='34'?'good':'')});mistake.innerHTML='<strong>将错就错：</strong>先把错误算式当作正确算式逆推未知数，再代回原式按正确顺序计算。'}
else if(i===4){grid.innerHTML=`<section class="lab"><h3>数位拨号盘</h3><p>拨动数字，观察分级与读法。</p><div class="digit-row">${['万','千','百','十','个'].map((n,k)=>`<div class="digit-cell"><small>${n}位</small><button data-up="${k}">＋</button><b id="d${k}">${k===0?3:k===2?5:0}</b><button data-down="${k}">－</button></div>`).join('')}</div><div class="lab-result" id="digitFb"></div></section><section class="lab"><h3>四舍五入数轴</h3><p>拖动观察约等于79万还是80万，找出分界点。</p><input id="round" type="range" min="790000" max="800000" step="100" value="794900" style="width:100%;accent-color:var(--accent)"><div class="formula" id="roundN">794900</div><div class="lab-result" id="roundFb"></div><div class="rule">795000是分界点；小于它约79万，大于或等于它约80万。</div></section>`;let ds=[3,0,5,0,0];const zhDigits=['零','一','二','三','四','五','六','七','八','九'],zhUnits=['','十','百','千'];function sectionZh(n){let s='',zero=false,pos=0;while(n>0){const d=n%10;if(d===0){if(!zero&&s){s='零'+s;zero=true}}else{s=zhDigits[d]+zhUnits[pos]+s;zero=false}n=Math.floor(n/10);pos++}return s.replace(/零+$/,'')}function numberZh(n){if(n===0)return'零';const wan=Math.floor(n/10000),low=n%10000;let s=wan?zhDigits[wan]+'万':'';if(low){if(wan&&low<1000)s+='零';s+=sectionZh(low)}return wan?s:s.replace(/^一十/,'十')}const readNum=()=>{let n=+ds.join('');$('#digitFb').textContent=`写作：${n}　读作：${numberZh(n)}`};document.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{let k=+x.dataset.up;ds[k]=(ds[k]+1)%10;$('#d'+k).textContent=ds[k];readNum()});document.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>{let k=+x.dataset.down;ds[k]=(ds[k]+9)%10;$('#d'+k).textContent=ds[k];readNum()});readNum();const round=()=>{let n=+$('#round').value;$('#roundN').textContent=n;$('#roundFb').textContent=`省略万位后面的尾数：${n<795000?'约79万':'约80万'}`};$('#round').oninput=round;round();mistake.innerHTML='<strong>易错提醒：</strong>改写大小不变，用“＝”；求近似数大小可能变化，用“≈”。'}
else{grid.innerHTML=`<section class="lab"><h3>估算策略室</h3><p>200元买3副73元的球拍，该怎样估？</p><div class="control-row"><button class="chip" data-est="up">往大估</button><button class="chip" data-est="down">往小估</button></div><div class="lab-result" id="estFb">选择策略。</div><div class="rule">往小估都不够，实际一定不够。</div></section><section class="lab"><h3>验算小卫士</h3><p>只看个位，判断365＋278＝554对不对。</p><div class="control-row"><button class="chip" data-tail="yes">✓ 对</button><button class="chip" data-tail="no">✗ 错</button></div><div class="lab-result" id="tailFb"></div></section>`;document.querySelectorAll('[data-est]').forEach(x=>x.onclick=()=>{$('#estFb').textContent=x.dataset.est==='down'?'正确：73往小估成70，70×3＝210＞200，所以一定不够。':'判断“不够”时，先往小估更有说服力。';$('#estFb').className='lab-result '+(x.dataset.est==='down'?'good':'bad')});document.querySelectorAll('[data-tail]').forEach(x=>x.onclick=()=>{$('#tailFb').textContent=x.dataset.tail==='no'?'正确！5＋8＝13，结果个位应是3；554的个位是4，立即排除。':'再看个位：5＋8＝13，和的个位应是3，不可能是4。';$('#tailFb').className='lab-result '+(x.dataset.tail==='no'?'good':'bad')});mistake.innerHTML='<strong>易错提醒：</strong>估算策略取决于问题：证明“够”可往大估；证明“不够”可往小估。'} }
function renderEnergy(){energy.hidden=false;$('#energyText').textContent=`${step} / 6`;$('#energyCells').innerHTML=Array.from({length:6},(_,i)=>`<span class="energy-cell ${i<step?'on':''}"></span>`).join('')}
function itemAt(){return step<3?levels[current].warm[step]:levels[current].challenge[step-3]}
function renderQuestion(){phase='quiz';journey('quiz');answered=false;selected='';renderEnergy();const item=itemAt(),hard=step>=3;$('#gameStage').textContent=hard?'应用挑战关 · 3题':'热身关 · 3题';let answer='';if(item.t==='choice')answer=`<div class="options">${item.o.map(o=>`<button class="option" type="button" data-answer="${esc(o)}">${o}</button>`).join('')}</div>`;if(item.t==='judge')answer=`<div class="options judge-options"><button class="option" type="button" data-answer="对">对</button><button class="option" type="button" data-answer="错">错</button></div>`;if(item.t==='fill')answer=`<input class="answer-input" id="answerInput" inputmode="text" autocomplete="off" placeholder="在这里输入答案" aria-label="填写答案">`;content.innerHTML=`<article class="panel"><div class="question-meta"><span class="phase-pill">${hard?'应用挑战':'热身关'}</span><span>第 ${hard?step-2:step+1} / 3 题</span></div><p class="question">${item.q}</p>${answer}<div class="feedback" id="feedback" role="status"></div><div id="solutionSlot"></div><div class="submit-row"><button class="primary" id="submitBtn" type="button" disabled>检查答案</button></div></article>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;document.querySelectorAll('[data-answer]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.answer;$('#submitBtn').disabled=false});const input=$('#answerInput');if(input){input.oninput=()=>$('#submitBtn').disabled=!input.value.trim();input.onkeydown=e=>{if(e.key==='Enter'&&!$('#submitBtn').disabled)checkAnswer()};setTimeout(()=>input.focus(),80)}$('#submitBtn').onclick=checkAnswer}
function normalize(s){return String(s).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[，、]/g,',').replace(/\s+/g,'')}
function solutionHtml(item){const steps=item.steps||['读清题意，圈出已知量和所求量。',`找到知识点：${item.tag}。`,item.e,'把结果代回题意检查单位和大小是否合理。'];const names=['① 审题','② 找关系','③ 列式计算','④ 验算与答'];return`<section class="solution"><div class="solution-title">🧠 思路解析 · 点开每一步</div>${steps.map((s,i)=>`<details ${i===0?'open':''}><summary>${names[i]}</summary><p>${s}</p></details>`).join('')}<span class="knowledge-tag">知识点：${item.tag}</span></section>`}
function checkAnswer(){if(answered)return;const item=itemAt(),val=item.t==='fill'?normalize($('#answerInput').value):selected,ok=val===normalize(item.a),hard=step>=3;answered=true;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(normalize(b.dataset.answer)===normalize(item.a))b.classList.add('correct');if(!ok&&normalize(b.dataset.answer)===val)b.classList.add('wrong')});const input=$('#answerInput');if(input){input.disabled=true;input.classList.add(ok?'correct':'wrong')}const fb=$('#feedback');fb.className=`feedback show ${ok?'good':'bad'}`;fb.innerHTML=ok?`<strong>✅ ${praise[Math.floor(Math.random()*praise.length)]}</strong><p>${item.e}</p>`:`<strong>❌ 再想一想</strong><p><b>正确答案：${item.a}</b><br>${item.e}</p>`;$('#solutionSlot').innerHTML=solutionHtml(item);if(ok){sound('good');step++;renderEnergy();$('#submitBtn').textContent=step===6?'看看成绩':'继续';$('#submitBtn').disabled=false;$('#submitBtn').onclick=()=>step===6?renderResult():renderQuestion()}else{wrongs++;sound('bad');$('#submitBtn').textContent=hard?'回热身巩固':'收起解析，再答一次';$('#submitBtn').disabled=false;$('#submitBtn').onclick=()=>{if(hard)step=0;renderQuestion()}}}
function renderResult(){phase='result';journey('result');const l=levels[current],rating=wrongs===0?3:wrongs<=2?2:1;stars[current]=Math.max(stars[current],rating);unlocked=Math.max(unlocked,Math.min(6,current+2));energy.hidden=true;$('#gameStage').textContent='闯关成功';sound('win');startConfetti();const last=current===5;content.innerHTML=`<article class="panel result"><div class="trophy">🏆</div><h2>${last?'全部通关！':'第 '+(current+1)+' 关完成！'}</h2><p class="result-sub">${last?'你是数学小达人！':`答错 ${wrongs} 次，获得 ${rating} 星评价`}</p><div class="result-stars">${'★'.repeat(rating)}${'☆'.repeat(3-rating)}</div><div class="review"><h3>你的知识网络</h3><ul>${l.mind.map(x=>`<li><b>${x[0]}</b>：${x[1][0]}</li>`).join('')}</ul></div><div class="result-actions">${last?'':`<button class="primary" id="nextBtn" type="button">下一关</button>`}<button class="secondary ${last?'only':''}" id="replayBtn" type="button">再学一次</button><button class="ghost ${last?'only':''}" id="returnBtn" type="button">返回地图</button></div></article>`;if(!last)$('#nextBtn').onclick=()=>openLevel(current+1);$('#replayBtn').onclick=()=>openLevel(current);$('#returnBtn').onclick=renderMap}
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function sound(type){if(muted)return;try{ensureAudio();const notes=type==='good'?[523,659]:type==='bad'?[230,180]:type==='win'?[523,659,784,1046]:[392];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='bad'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audioCtx.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.1,audioCtx.currentTime+i*.1+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+i*.1+.16);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+i*.1);o.stop(audioCtx.currentTime+i*.1+.18)})}catch(e){}}
function toggleMute(){muted=!muted;document.querySelectorAll('.soundIcon').forEach(x=>x.textContent=muted?'🔇':'🔊');document.querySelectorAll('.icon-btn').forEach(x=>x.setAttribute('aria-label',muted?'开启音效':'关闭音效'));const l=$('#mapMute .mute-label');if(l)l.textContent=muted?'音效关':'音效开';if(!muted)sound('start')}
function startConfetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti'),ctx=c.getContext('2d'),colors=['#f43f5e','#f7b928','#22c55e','#3b82f6','#a855f7','#06b6d4'];let bits=[];c.width=innerWidth;c.height=innerHeight;for(let i=0;i<100;i++)bits.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:3+Math.random()*5,a:Math.random()*6.28,color:colors[i%colors.length]});let frame=0;(function tick(){ctx.clearRect(0,0,c.width,c.height);bits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.08;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});if(frame++<180)requestAnimationFrame(tick);else ctx.clearRect(0,0,c.width,c.height)})()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
$('#backMap').onclick=renderMap;$('#mapMute').onclick=toggleMute;$('#gameMute').onclick=toggleMute;document.addEventListener('pointerdown',function init(){if(!muted)ensureAudio()},{once:true});renderMap();
})();
</script>
</body></html>
